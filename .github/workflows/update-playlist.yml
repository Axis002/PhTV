name: Update Dispatchwrapparr Playlist

on:
  schedule:
    - cron: "17 12 * * *" # Runs every day at 19:00 UTC
  workflow_dispatch: # Keeps the manual "Run workflow" button active

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Convert playlist
        run: python convert_to_dispatchwrapparr.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add axis.m3u
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update playlist $(date -u +%Y-%m-%d)"
            git push
          fi
