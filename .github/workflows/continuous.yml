name: Continuous Loop Workflow

on:
  workflow_dispatch: 
  repository_dispatch:
    types: [loop_trigger]

jobs:
  loop_job:
    runs-on: ubuntu-latest
    concurrency:
      group: continuous-loop
      cancel-in-progress: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Main Task
        run: |
          echo "Your continuous task runs here!"
          sleep 10

      - name: Cool Down Period
        run: sleep 30

      # Clean, reliable community action replacing the broken curl command
      - name: Trigger Next Loop
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.MY_LOOP_TOKEN }}
          event-type: loop_trigger
