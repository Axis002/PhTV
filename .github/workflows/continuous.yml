name: Continuous Loop Workflow

on:
  workflow_dispatch: # <--- THIS LINE CREATES THE RUN BUTTON
  repository_dispatch:
    types: [loop_trigger]

jobs:
  loop_job:
    runs-on: ubuntu-latest
    concurrency:
      group: continuous-loop
      cancel-in-progress: true
    steps:
      - name: Run Main Task
        run: |
          echo "Your continuous task runs here!"
          sleep 10

      - name: Trigger Next Loop
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.MY_LOOP_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com{{ github.repository }}/dispatches \
            -d '{"event_type": "loop_trigger"}'
